# Optional gate.yaml: only facts about the repository that Gate cannot derive.
# Every key is optional; unknown keys are errors. Commit it on the base branch;
# Gate reads it from the merge-base so a branch cannot weaken its own checks.
base: main                    # only when origin/HEAD is not the target branch
prepare:                      # only when the lockfile does not describe the install
  - name: deps
    run: [bun, install, --cwd, web, --frozen-lockfile]
    timeout: 10m
signoff_paths: ["internal/state/**"]
verify:
  surfaces: ["cmd/**"]
  setup: [go, build, -o, .gate-bin/gate, ./cmd/gate]
  scenarios:
    - name: help
      run: [.gate-bin/gate, --help]
      exit: 0
      stdout_contains: "usage"
waivers:
  - {obligation: deadcode, reason: "not applicable"}
